<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The share page URL contains a live approval token, and this page loads
         external fonts. The browser default would send only the origin, but
         pinning it costs nothing and removes the question entirely. -->
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Banana Digital — Client Portal</title>
    <meta name="title" content="Banana Digital — Client Portal" />
    <meta
      name="description"
      content="Client portal and CRM for Banana Digital London."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portal.hackdojob.com" />
    <meta property="og:title" content="Banana Digital — Client Portal" />
    <meta
      property="og:description"
      content="Client portal and CRM for Banana Digital London."
    />
    <meta
      property="og:image"
      content="https://portal.hackdojob.com/images/og.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://portal.hackdojob.com" />
    <meta property="twitter:title" content="Banana Digital — Client Portal" />
    <meta
      property="twitter:description"
      content="Client portal and CRM for Banana Digital London."
    />
    <meta
      property="twitter:image"
      content="https://portal.hackdojob.com/images/og.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#FFF8E7" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
